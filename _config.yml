# GitHub Pages: plain HTML, generated by tools/gen_site.py. Jekyll skips dot-folders;
# .well-known holds apple-app-site-association (Garum's Universal Links, gen_garum_share.py).
# docs/, tools/ and README.md are the site's source notes, not pages: they stay off the web.
include:
  - .well-known
exclude:
  - docs
  - tools
  - README.md
